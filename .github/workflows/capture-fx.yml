name: Update Stock Connect FX
on:
  schedule:
    - cron: '17 0-15 * * 1-5'
  workflow_dispatch:
  push:
    paths: ['scripts/update_connect.py', '.github/workflows/capture-fx.yml']
permissions:
  contents: write
concurrency:
  group: capture-hk-fx
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_connect.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/connect-fx.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official Stock Connect FX'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
