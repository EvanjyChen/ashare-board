name: Capture HK close FX
on:
  schedule:
    - cron: '25 3,7 * * 1-5'
  workflow_dispatch:
  push:
    paths: ['scripts/capture_fx.py', '.github/workflows/capture-fx.yml']
permissions:
  contents: write
concurrency:
  group: capture-hk-fx
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install exchange-calendars==4.13.2
      - run: python scripts/capture_fx.py --probe
      - if: github.event_name == 'push'
        run: python scripts/capture_fx.py --calendar-only
      - if: github.event_name != 'push'
        run: python scripts/capture_fx.py
      - name: Save archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hkd-cny.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record HK close FX snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
